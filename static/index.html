<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ALTROS</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --cyan: #00f5ff;
  --blue: #0066ff;
  --dark: #020812;
  --border: rgba(0,245,255,0.12);
  --text: rgba(200,240,255,0.92);
  --muted: rgba(100,180,200,0.55);
  --user-bg: rgba(0,100,255,0.15);
  --ai-bg: rgba(0,245,255,0.04);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{background:var(--dark);color:var(--text);font-family:'Rajdhani',sans-serif;height:100dvh;display:flex;flex-direction:column;overflow:hidden;}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,245,255,0.025) 1px,transparent 1px),linear-gradient(90deg,rgba(0,245,255,0.025) 1px,transparent 1px);background-size:50px 50px;pointer-events:none;z-index:0;}

.header{position:relative;z-index:10;padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(2,8,18,0.97);flex-shrink:0;}
.logo{font-family:'Orbitron',monospace;font-size:22px;font-weight:900;letter-spacing:5px;color:var(--cyan);text-shadow:0 0 25px rgba(0,245,255,0.5);}
.logo-sub{font-size:7px;letter-spacing:2px;color:var(--muted);margin-top:1px;}
.header-right{display:flex;align-items:center;gap:8px;}
.status-pill{display:flex;align-items:center;gap:5px;background:rgba(0,255,100,0.06);border:1px solid rgba(0,255,100,0.2);border-radius:20px;padding:4px 10px;font-size:10px;letter-spacing:1px;color:rgba(0,255,130,0.8);font-family:'Orbitron',monospace;}
.status-pill::before{content:'';width:5px;height:5px;border-radius:50%;background:#00ff88;box-shadow:0 0 6px #00ff88;animation:blink 2s infinite;}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.3}}
.btn-clear{background:none;border:1px solid var(--border);border-radius:8px;padding:5px 10px;color:var(--muted);font-size:10px;cursor:pointer;font-family:'Rajdhani',sans-serif;letter-spacing:1px;}

.orb-section{position:relative;z-index:5;display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1px solid var(--border);background:rgba(2,8,18,0.8);flex-shrink:0;}
canvas#orbCanvas{width:80px;height:80px;flex-shrink:0;filter:drop-shadow(0 0 12px rgba(0,180,255,0.4));}
.orb-info{flex:1;min-width:0;}
.orb-status-text{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:2px;color:var(--cyan);opacity:0.8;}
.orb-last{font-size:12px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.waveform{display:flex;align-items:center;gap:2px;height:30px;}
.wbar{width:3px;border-radius:3px;min-height:3px;background:var(--cyan);box-shadow:0 0 4px var(--cyan);}
.waveform.active .wbar{animation:wdance 0.8s ease-in-out infinite;}
.wbar:nth-child(1){animation-delay:0s;animation-duration:.7s}.wbar:nth-child(2){animation-delay:.1s;animation-duration:.9s}.wbar:nth-child(3){animation-delay:.2s;animation-duration:.6s}.wbar:nth-child(4){animation-delay:.05s;animation-duration:.85s}.wbar:nth-child(5){animation-delay:.15s;animation-duration:1s}.wbar:nth-child(6){animation-delay:.25s;animation-duration:.7s}.wbar:nth-child(7){animation-delay:.1s;animation-duration:.8s}.wbar:nth-child(8){animation-delay:.2s;animation-duration:.65s}
@keyframes wdance{0%,100%{height:3px}50%{height:28px}}

.chat-area{flex:1;overflow-y:auto;padding:12px 14px 8px;display:flex;flex-direction:column;gap:10px;position:relative;z-index:5;scroll-behavior:smooth;}
.chat-area::-webkit-scrollbar{width:2px;}.chat-area::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.msg{max-width:88%;display:flex;flex-direction:column;gap:3px;animation:msgIn .25s ease;}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.msg.user{align-self:flex-end;}.msg.ai{align-self:flex-start;}
.msg-label{font-family:'Orbitron',monospace;font-size:8px;letter-spacing:2px;opacity:0.6;padding:0 4px;}
.msg.user .msg-label{color:rgba(100,180,255,0.7);text-align:right;}.msg.ai .msg-label{color:var(--cyan);}
.msg-bubble{padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.6;}
.msg.user .msg-bubble{background:var(--user-bg);border:1px solid rgba(0,100,255,0.22);border-bottom-right-radius:4px;}
.msg.ai .msg-bubble{background:var(--ai-bg);border:1px solid var(--border);border-bottom-left-radius:4px;}

.typing-dots{display:flex;gap:5px;padding:12px 14px;background:var(--ai-bg);border:1px solid var(--border);border-radius:14px;border-bottom-left-radius:4px;align-self:flex-start;}
.typing-dots span{width:6px;height:6px;border-radius:50%;background:var(--cyan);animation:tdot 1.2s infinite;}
.typing-dots span:nth-child(2){animation-delay:.2s}.typing-dots span:nth-child(3){animation-delay:.4s}
@keyframes tdot{0%,80%,100%{transform:scale(.5);opacity:.3}40%{transform:scale(1);opacity:1}}
.cursor{display:inline-block;width:2px;height:14px;background:var(--cyan);margin-left:2px;animation:bcur .7s infinite;vertical-align:middle;}
@keyframes bcur{0%,100%{opacity:1}50%{opacity:0}}

.input-area{position:relative;z-index:10;padding:10px 14px 16px;border-top:1px solid var(--border);background:rgba(2,8,18,0.97);flex-shrink:0;}
.quick-row{display:flex;gap:7px;margin-bottom:9px;overflow-x:auto;padding-bottom:2px;}
.quick-row::-webkit-scrollbar{display:none}
.qbtn{background:rgba(0,245,255,0.05);border:1px solid var(--border);border-radius:20px;padding:5px 12px;color:var(--muted);font-family:'Rajdhani',sans-serif;font-size:12px;white-space:nowrap;cursor:pointer;letter-spacing:.3px;transition:all .15s;}
.qbtn:active{background:rgba(0,245,255,0.12);color:var(--cyan);border-color:rgba(0,245,255,0.35);}
.qbtn.voice-btn{background:rgba(0,150,255,0.08);border-color:rgba(0,150,255,0.2);color:rgba(100,200,255,0.8);}
.qbtn.voice-btn.active{background:rgba(255,50,50,0.12);border-color:rgba(255,80,0,0.3);color:rgba(255,150,100,0.9);}

.voice-bar{display:none;align-items:center;justify-content:center;gap:10px;padding:7px 0;margin-bottom:8px;background:rgba(0,150,255,0.06);border:1px solid rgba(0,150,255,0.18);border-radius:10px;}
.voice-bar.active{display:flex;}
.v-dot{width:10px;height:10px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);animation:vpulse 1s infinite;}
@keyframes vpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.3;transform:scale(.7)}}
.v-label{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:2px;color:rgba(100,220,255,.9);}
.v-stop{background:rgba(255,50,50,.15);border:1px solid rgba(255,80,0,.3);border-radius:7px;padding:3px 10px;color:rgba(255,150,100,.9);font-size:11px;cursor:pointer;font-family:'Rajdhani',sans-serif;}

.input-row{display:flex;gap:9px;align-items:flex-end;}
.input-wrap{flex:1;background:rgba(0,245,255,0.04);border:1px solid var(--border);border-radius:20px;padding:10px 14px;display:flex;align-items:center;gap:8px;transition:border-color .2s;}
.input-wrap:focus-within{border-color:rgba(0,245,255,.35);}
textarea{flex:1;background:none;border:none;outline:none;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:15px;resize:none;max-height:80px;line-height:1.4;padding:0;}
textarea::placeholder{color:var(--muted);}
textarea::-webkit-scrollbar{display:none;}
.btn-mic-inline{background:none;border:none;cursor:pointer;padding:2px;opacity:.6;flex-shrink:0;}
.btn-mic-inline.rec svg{stroke:#ff4444;filter:drop-shadow(0 0 6px #ff4444);}
.btn-mic-inline.rec{opacity:1;}
.btn-send{width:44px;height:44px;border-radius:50%;border:none;background:linear-gradient(135deg,#0044cc,#00ccff);box-shadow:0 0 15px rgba(0,150,255,.3);cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:transform .15s;}
.btn-send:active{transform:scale(.9);}

.corner{position:fixed;width:18px;height:18px;border-color:rgba(0,245,255,.2);border-style:solid;z-index:100;pointer-events:none;}
.ctlr{top:6px;left:6px;border-width:2px 0 0 2px;}.ctrr{top:6px;right:6px;border-width:2px 2px 0 0;}
.cblr{bottom:6px;left:6px;border-width:0 0 2px 2px;}.cbrr{bottom:6px;right:6px;border-width:0 2px 2px 0;}
</style>
</head>
<body>
<div class="corner ctlr"></div><div class="corner ctrr"></div>
<div class="corner cblr"></div><div class="corner cbrr"></div>

<div class="header">
  <div><div class="logo">ALTROS</div><div class="logo-sub">AUTONOMOUS · TACTICAL · REASONING · OS</div></div>
  <div class="header-right">
    <div class="status-pill">ONLINE</div>
    <button class="btn-clear" onclick="clearChat()">CLEAR</button>
  </div>
</div>

<div class="orb-section">
  <canvas id="orbCanvas" width="160" height="160"></canvas>
  <div class="orb-info">
    <div class="orb-status-text" id="orbStatus">STANDBY</div>
    <div class="orb-last" id="orbLast">Ready for input...</div>
  </div>
  <div class="waveform" id="waveform">
    <div class="wbar"></div><div class="wbar"></div><div class="wbar"></div>
    <div class="wbar"></div><div class="wbar"></div><div class="wbar"></div>
    <div class="wbar"></div><div class="wbar"></div>
  </div>
</div>

<div class="chat-area" id="chatArea">
  <div class="msg ai">
    <div class="msg-label">ALTROS</div>
    <div class="msg-bubble">hello bro what's up? 🔷</div>
  </div>
</div>

<div class="input-area">
  <div class="quick-row">
    <button class="qbtn" onclick="qs('aaj ki latest news batao')">📡 News</button>
    <button class="qbtn" onclick="qs('mera profile batao')">🧠 Profile</button>
    <button class="qbtn" onclick="qs('Atomic Habits se best habit batao')">📚 Book</button>
    <button class="qbtn" onclick="qs('aaj ke liye ek action step batao')">⚡ Action</button>
    <button class="qbtn voice-btn" id="voiceModeBtn" onclick="toggleVoiceMode()">🎙️ Voice Mode</button>
  </div>
  <div class="voice-bar" id="voiceBar">
    <div class="v-dot"></div>
    <span class="v-label" id="vLabel">LISTENING...</span>
    <button class="v-stop" onclick="stopVoiceMode()">STOP</button>
  </div>
  <div class="input-row">
    <div class="input-wrap">
      <textarea id="inputField" rows="1" placeholder="Kuch bhi poocho..."
        oninput="autoResize(this)"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMsg()}"></textarea>
      <button class="btn-mic-inline" id="micBtn" onclick="toggleMic()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="rgba(0,245,255,0.7)" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v4M8 23h8"/>
        </svg>
      </button>
    </div>
    <button class="btn-send" id="sendBtn" onclick="sendMsg()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="white">
        <path d="M22 2L11 13M22 2L15 22l-4-9-9-4 20-7z"/>
      </svg>
    </button>
  </div>
</div>

<script>
// ── 3D Blue Orb ──
const canvas = document.getElementById('orbCanvas');
const ctx = canvas.getContext('2d');
const W=canvas.width, H=canvas.height, cx=W/2, cy=H/2, R=62;
let orbState='standby', frame=0, energyLevel=0;

const lines=[];
for(let i=0;i<28;i++) lines.push({phi:Math.random()*Math.PI*2,theta:Math.random()*Math.PI,len:.3+Math.random()*.8,speed:(Math.random()-.5)*.008,alpha:.2+Math.random()*.6,width:.5+Math.random()*1.2,type:Math.random()>.5?'arc':'line'});
const particles=[];
for(let i=0;i<60;i++){const phi=Math.random()*Math.PI*2,theta=Math.random()*Math.PI;particles.push({phi,theta,r:R-2+Math.random()*6,speed:.003+Math.random()*.01,alpha:.3+Math.random()*.7,size:.5+Math.random()*1.5});}

function project(phi,theta,r){
  const rotY=frame*.008;
  const x=r*Math.sin(theta)*Math.cos(phi+rotY);
  const y=r*Math.cos(theta);
  const z=r*Math.sin(theta)*Math.sin(phi+rotY);
  const scale=(z+R*2)/(R*3);
  return{x:cx+x*scale,y:cy-y*scale,z,scale};
}

function drawOrb(){
  ctx.clearRect(0,0,W,H);
  const t=frame*.02;
  const pulse=orbState==='speaking'?.3*Math.sin(t*4):orbState==='thinking'?.15*Math.sin(t*2):0;
  const glowR=R+8+pulse*15;

  const grd=ctx.createRadialGradient(cx,cy,R*.3,cx,cy,glowR*1.4);
  const al=.04+(orbState==='speaking'?.06:0)+Math.abs(pulse)*.05;
  grd.addColorStop(0,`rgba(0,200,255,${al*3})`);
  grd.addColorStop(.5,`rgba(0,100,255,${al})`);
  grd.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=grd;ctx.beginPath();ctx.arc(cx,cy,glowR*1.4,0,Math.PI*2);ctx.fill();

  const sg=ctx.createRadialGradient(cx-20,cy-20,5,cx,cy,R+pulse*8);
  if(orbState==='thinking'){sg.addColorStop(0,'rgba(100,200,255,.25)');sg.addColorStop(.5,'rgba(0,100,255,.15)');sg.addColorStop(1,'rgba(0,10,50,.35)');}
  else if(orbState==='listening'){sg.addColorStop(0,'rgba(0,255,200,.25)');sg.addColorStop(.5,'rgba(0,200,150,.15)');sg.addColorStop(1,'rgba(0,40,30,.35)');}
  else{sg.addColorStop(0,'rgba(0,200,255,.2)');sg.addColorStop(.5,'rgba(0,80,200,.12)');sg.addColorStop(1,'rgba(0,10,50,.3)');}
  ctx.fillStyle=sg;ctx.beginPath();ctx.arc(cx,cy,R+pulse*8,0,Math.PI*2);ctx.fill();

  ctx.strokeStyle=`rgba(0,200,255,${.25+Math.abs(pulse)*.5})`;
  ctx.lineWidth=1;ctx.beginPath();ctx.arc(cx,cy,R+pulse*8,0,Math.PI*2);ctx.stroke();

  const rotY=frame*.008;
  lines.forEach(l=>{
    l.phi+=l.speed;
    const p=project(l.phi,l.theta,R+1);
    const vis=(p.z+R)/(R*2);
    if(vis<.1)return;
    const ba=l.alpha*vis*(.7+energyLevel*.3);
    ctx.strokeStyle=`rgba(0,220,255,${ba})`;
    ctx.lineWidth=l.width*vis;ctx.beginPath();
    if(l.type==='arc'){const al=l.len*.4;ctx.arc(cx,cy,(R+1)*p.scale,l.phi+rotY-al,l.phi+rotY+al);}
    else{const p2=project(l.phi+l.len*.3,l.theta+l.len*.2,R+1);ctx.moveTo(p.x,p.y);ctx.lineTo(p2.x,p2.y);}
    ctx.stroke();
  });

  particles.forEach(p=>{
    p.phi+=p.speed*(1+energyLevel);
    const pt=project(p.phi,p.theta,p.r);
    const vis=(pt.z+R)/(R*2);
    if(vis<.1)return;
    const pa=p.alpha*vis;
    const col=orbState==='listening'?`rgba(0,255,200,${pa})`:`rgba(0,200,255,${pa})`;
    ctx.fillStyle=col;ctx.shadowColor=col;ctx.shadowBlur=4*vis;
    ctx.beginPath();ctx.arc(pt.x,pt.y,p.size*vis*pt.scale,0,Math.PI*2);ctx.fill();
    ctx.shadowBlur=0;
  });

  if(orbState==='speaking'){
    const burst=.5+.5*Math.sin(t*6);
    const cg=ctx.createRadialGradient(cx,cy,0,cx,cy,R*.6*burst);
    cg.addColorStop(0,`rgba(100,220,255,${.4*burst})`);cg.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=cg;ctx.beginPath();ctx.arc(cx,cy,R*.6*burst,0,Math.PI*2);ctx.fill();
  }

  const hl=ctx.createRadialGradient(cx-20,cy-20,2,cx-14,cy-18,R*.55);
  hl.addColorStop(0,'rgba(200,240,255,.15)');hl.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=hl;ctx.beginPath();ctx.arc(cx,cy,R+pulse*8,0,Math.PI*2);ctx.fill();

  frame++;
  if(orbState==='speaking') energyLevel=Math.min(1,energyLevel+.05);
  else energyLevel=Math.max(0,energyLevel-.03);
  requestAnimationFrame(drawOrb);
}
drawOrb();

// ── Chat ──
const BASE=window.location.origin;
const chatArea=document.getElementById('chatArea');
const inputField=document.getElementById('inputField');
const orbStatusEl=document.getElementById('orbStatus');
const orbLastEl=document.getElementById('orbLast');
const waveform=document.getElementById('waveform');
const micBtn=document.getElementById('micBtn');
let isRec=false, recognition=null;

function setOrb(state){
  orbState=state;
  const labels={standby:'STANDBY',thinking:'PROCESSING',speaking:'RESPONDING',listening:'LISTENING'};
  orbStatusEl.textContent=labels[state]||'STANDBY';
  waveform.className='waveform'+(state==='speaking'||state==='listening'?' active':'');
}

function autoResize(el){el.style.height='auto';el.style.height=Math.min(el.scrollHeight,80)+'px';}

function addMsg(role,text){
  const wrap=document.createElement('div');wrap.className='msg '+(role==='user'?'user':'ai');
  const lbl=document.createElement('div');lbl.className='msg-label';lbl.textContent=role==='user'?'MANISH':'ALTROS';
  const bubble=document.createElement('div');bubble.className='msg-bubble';bubble.textContent=text;
  wrap.appendChild(lbl);wrap.appendChild(bubble);chatArea.appendChild(wrap);
  chatArea.scrollTop=chatArea.scrollHeight;
  return bubble;
}

function addTyping(){
  const d=document.createElement('div');d.id='typing';d.className='typing-dots';
  d.innerHTML='<span></span><span></span><span></span>';
  chatArea.appendChild(d);chatArea.scrollTop=chatArea.scrollHeight;
}
function removeTyping(){const t=document.getElementById('typing');if(t)t.remove();}

async function sendMsg(){
  const text=inputField.value.trim();
  if(!text)return;
  inputField.value='';inputField.style.height='auto';
  addMsg('user',text);
  orbLastEl.textContent=text.slice(0,45);
  setOrb('thinking');addTyping();

  try{
    const res=await fetch(BASE+'/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({text:text})
    });
    if(!res.ok) throw new Error('Server error');
    const data=await res.json();
    removeTyping();
    setOrb('speaking');

    // Typewriter effect
    const bubble=addMsg('ai','');
    const cursor=document.createElement('span');cursor.className='cursor';bubble.appendChild(cursor);
    const reply=data.response||'Koi response nahi aaya.';
    let i=0;
    const tw=setInterval(()=>{
      if(i>=reply.length){clearInterval(tw);bubble.textContent=reply;orbLastEl.textContent=reply.slice(0,45);}
      else{bubble.textContent=reply.slice(0,i++);bubble.appendChild(cursor);}
      chatArea.scrollTop=chatArea.scrollHeight;
    },22);

    setTimeout(()=>setOrb('standby'),reply.length*22+3000);
  }catch(e){
    removeTyping();setOrb('standby');
    addMsg('ai','Connection error. ALTROS laptop pe chal raha hai? Ngrok on hai?');
    console.error(e);
  }
}

function qs(text){inputField.value=text;sendMsg();}
function clearChat(){chatArea.innerHTML='';addMsg('ai','Clear. Fresh start.');}

function toggleMic(){
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){addMsg('ai','Chrome use karo voice ke liye.');return;}
  if(isRec){recognition?.stop();isRec=false;micBtn.classList.remove('rec');setOrb('standby');return;}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  recognition=new SR();recognition.lang='hi-IN';recognition.continuous=false;recognition.interimResults=false;
  recognition.onstart=()=>{isRec=true;micBtn.classList.add('rec');setOrb('listening');};
  recognition.onresult=(e)=>{inputField.value=e.results[0][0].transcript;sendMsg();};
  recognition.onend=()=>{isRec=false;micBtn.classList.remove('rec');};
  recognition.start();
}

// ── Voice Mode ──
let voiceMode=false, voiceRec=null, isSpeaking=false;

function toggleVoiceMode(){
  if(voiceMode){stopVoiceMode();return;}
  if(!('webkitSpeechRecognition' in window)&&!('SpeechRecognition' in window)){addMsg('ai','Chrome browser use karo.');return;}
  voiceMode=true;
  document.getElementById('voiceBar').classList.add('active');
  document.getElementById('voiceModeBtn').classList.add('active');
  document.getElementById('voiceModeBtn').textContent='🔴 Voice ON';
  startListeningCycle();
}

function stopVoiceMode(){
  voiceMode=false;isSpeaking=false;
  voiceRec&&voiceRec.stop();
  window.speechSynthesis.cancel();
  document.getElementById('voiceBar').classList.remove('active');
  document.getElementById('voiceModeBtn').classList.remove('active');
  document.getElementById('voiceModeBtn').textContent='🎙️ Voice Mode';
  setOrb('standby');
}

function setVLabel(t){document.getElementById('vLabel').textContent=t;}

function startListeningCycle(){
  if(!voiceMode||isSpeaking)return;
  setOrb('listening');setVLabel('LISTENING...');
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  voiceRec=new SR();voiceRec.lang='hi-IN';voiceRec.continuous=false;voiceRec.interimResults=false;
  voiceRec.onresult=async(e)=>{
    const spoken=e.results[0][0].transcript;
    if(!spoken.trim()){startListeningCycle();return;}
    addMsg('user',spoken);setOrb('thinking');setVLabel('THINKING...');
    try{
      const res=await fetch(BASE+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:spoken})});
      const data=await res.json();
      addMsg('ai',data.response);
      speakReply(data.response);
    }catch(err){speakReply('Connection error bhai.');}
  };
  voiceRec.onerror=()=>{if(voiceMode&&!isSpeaking)setTimeout(startListeningCycle,1000);};
  voiceRec.onend=()=>{if(voiceMode&&!isSpeaking)setTimeout(startListeningCycle,500);};
  voiceRec.start();
}

function speakReply(text){
  isSpeaking=true;setOrb('speaking');setVLabel('ALTROS BOL RAHA HAI...');
  window.speechSynthesis.cancel();
  const clean=text.replace(/[^\x00-\x7F]/g,'').trim();
  const utt=new SpeechSynthesisUtterance(clean||text);
  utt.lang='en-IN';utt.rate=0.92;utt.pitch=0.85;
  const voices=window.speechSynthesis.getVoices();
  const v=voices.find(v=>v.lang.includes('en-IN'))||voices.find(v=>v.lang.includes('en-US'))||voices[0];
  if(v)utt.voice=v;
  utt.onend=()=>{isSpeaking=false;if(voiceMode)setTimeout(startListeningCycle,600);else setOrb('standby');};
  utt.onerror=()=>{isSpeaking=false;if(voiceMode)setTimeout(startListeningCycle,600);};
  window.speechSynthesis.speak(utt);
}

window.speechSynthesis.getVoices();
window.speechSynthesis.onvoiceschanged=()=>window.speechSynthesis.getVoices();
setOrb('standby');
</script>
